name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ '20.x', '22.x' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: false

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Run linter
      run: pnpm lint || true

    - name: Run unit tests
      run: pnpm test:unit || true

    - name: Run Cucumber BDD tests
      run: pnpm test:bdd
